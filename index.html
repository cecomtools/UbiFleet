<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>UbiFleet – Consulta por Placa</title>
    <link rel="icon" type="image/png" href="truck-dinet.png">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

    <style>
      /* Reseteo total: Sin márgenes, sin padding, ocupando el 100% exacto */
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden; /* Evita que salgan barras de scroll dobles */
        background-color: #020617; /* Fondo oscuro por si demora en cargar */
      }

      /* El Iframe ocupará absolutamente toda la pantalla */
      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
    </style>
  </head>

  <body>
    <iframe
      src="https://script.google.com/macros/s/AKfycbx3jkBIV468SFdRbRroJb6ji4WVlSd3DxA_agUGXq-oNlZjRh_LP84DxDUsKXCnNXpwig/exec"
      title="UbiFleet – Consulta por placa"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      allowfullscreen>
    </iframe>
  </body>
</html>
